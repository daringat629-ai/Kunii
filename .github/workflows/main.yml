name: Build from zip

# Репозиторий содержит архив kuni-marin-integrated*.zip: сценарий сам берёт последний загруженный, распаковывает его,
# проверяет «Нулевое ядро» и собирает бота. Запуск: автоматически при загрузке архива или вручную (Run workflow).
on:
  workflow_dispatch:
  push:
    paths: ['*.zip', '.github/workflows/build-from-zip.yml']

concurrency:
  group: build-from-zip
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  zero-core-tests:
    name: Tests of Zero Core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Unpack the archive
        run: |
          # берём архив, который загружен в репозиторий последним (имена с номерами и пробелами не мешают)
          ZIP=$(for f in kuni-marin-integrated*.zip; do printf '%s\t%s\n' "$(git log -1 --format=%ct -- "$f")" "$f"; done | sort -n | tail -n 1 | cut -f2-)
          echo "Archive: $ZIP"
          ls -la kuni-marin-integrated*.zip
          mkdir tree
          unzip -q "$ZIP" -d tree
      - name: Run tests (manager, panel, JS, contract with the bot code)
        working-directory: tree/zero_core
        run: python3 -m unittest discover -s tests

  build-kuni:
    name: Build the bot (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Unpack the archive
        run: |
          # берём архив, который загружен в репозиторий последним (имена с номерами и пробелами не мешают)
          ZIP=$(for f in kuni-marin-integrated*.zip; do printf '%s\t%s\n' "$(git log -1 --format=%ct -- "$f")" "$f"; done | sort -n | tail -n 1 | cut -f2-)
          echo "Archive: $ZIP"
          ls -la kuni-marin-integrated*.zip
          mkdir tree
          unzip -q "$ZIP" -d tree
      - name: Restore AUI.BOOT deps cache
        id: aui-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.aui
          key: aui-boot-v1
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libglew-dev zlib1g-dev libssl-dev libcrypt-dev libcurl4-openssl-dev libgtk-4-dev libadwaita-1-dev libdbus-1-dev libfontconfig-dev ninja-build libpulse-dev libavcodec-dev libavformat-dev libavutil-dev libswscale-dev gperf
      - name: Setup Clang 22
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22 all
          echo "CC=clang-22" >> $GITHUB_ENV
          echo "CXX=clang++-22" >> $GITHUB_ENV
      - name: Configure CMake
        working-directory: tree
        run: cmake -G Ninja -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DAUI_INSTALL_RUNTIME_DEPENDENCIES=TRUE -DKUNI_USE_FFMPEG=ON
      - name: Save AUI.BOOT deps cache (right after configure, even if the build fails later)
        if: steps.aui-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.aui
          key: aui-boot-v1
      - name: Build the bot (keeps going to show ALL errors)
        shell: bash
        working-directory: tree
        run: cmake --build build --config RelWithDebInfo -- -k 0 2>&1 | tee build.log
      - name: Build tests
        shell: bash
        working-directory: tree
        run: cmake --build build --config RelWithDebInfo --target Tests -- -k 0 2>&1 | tee -a build.log
      - name: Run unit tests
        shell: bash
        working-directory: tree/build/bin
        run: ./Tests "--gtest_filter=-*Integration*" 2>&1 | tee ../../tests.log
      - name: Pack portable build
        working-directory: tree/build
        run: |
          cmake . -DAUI_APP_PACKAGING=AUI_PORTABLE_TGZ
          cmake --build . --config RelWithDebInfo
          cpack . -CRelWithDebInfo -B artifacts
      - name: Upload the build
        uses: actions/upload-artifact@v4
        with:
          name: kuni-linux
          path: tree/build/artifacts/*.*
      - name: Short error summary (shown on the run page)
        if: failure()
        working-directory: tree
        run: |
          {
            echo '### Build errors (first 60 lines)'
            echo '```'
            grep -n 'error:' build.log 2>/dev/null | cut -c1-260 | head -60 || true
            echo '--- failed files:'
            grep -E '^FAILED' build.log 2>/dev/null | cut -c1-140 | head -30 || true
            echo '```'
            echo '### Failed tests'
            echo '```'
            grep -n -E 'FAILED|Failure' tests.log 2>/dev/null | head -40 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

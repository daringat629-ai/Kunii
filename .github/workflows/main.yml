name: Build from zip

# Репозиторий содержит только архив kuni-marin-integrated_upgraded.zip: сценарий сам распаковывает его,
# проверяет «Нулевое ядро» и собирает бота. Запуск: автоматически при загрузке архива или вручную (Run workflow).
on:
  workflow_dispatch:
  push:
    paths: ['*.zip', '.github/workflows/build-from-zip.yml']

concurrency:
  group: build-from-zip
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  zero-core-tests:
    name: Tests of Zero Core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Unpack the archive
        run: |
          ZIP=$(ls kuni-marin-integrated*.zip | head -n 1)
          echo "Archive: $ZIP"
          mkdir tree
          unzip -q "$ZIP" -d tree
      - name: Run tests (manager, panel, JS, contract with the bot code)
        working-directory: tree/zero_core
        run: python3 -m unittest discover -s tests

  build-kuni:
    name: Build the bot (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack the archive
        run: |
          ZIP=$(ls kuni-marin-integrated*.zip | head -n 1)
          echo "Archive: $ZIP"
          mkdir tree
          unzip -q "$ZIP" -d tree
      - name: Cache AUI.BOOT deps
        uses: actions/cache@v4
        with:
          path: ~/.aui
          key: aui-boot-${{ hashFiles('*.zip') }}
          restore-keys: |
            aui-boot-
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libglew-dev zlib1g-dev libssl-dev libcrypt-dev libcurl4-openssl-dev libgtk-4-dev libadwaita-1-dev libdbus-1-dev libfontconfig-dev ninja-build libpulse-dev libavcodec-dev libavformat-dev libavutil-dev libswscale-dev gperf
      - name: Setup Clang 22
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22 all
          echo "CC=clang-22" >> $GITHUB_ENV
          echo "CXX=clang++-22" >> $GITHUB_ENV
      - name: Configure CMake
        working-directory: tree
        run: cmake -G Ninja -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DAUI_INSTALL_RUNTIME_DEPENDENCIES=TRUE -DKUNI_USE_FFMPEG=ON
      - name: Build the bot
        shell: bash
        working-directory: tree
        run: cmake --build build --config RelWithDebInfo 2>&1 | tee build.log
      - name: Build tests
        shell: bash
        working-directory: tree
        run: cmake --build build --config RelWithDebInfo --target Tests 2>&1 | tee -a build.log
      - name: Run unit tests
        shell: bash
        working-directory: tree/build/bin
        run: ./Tests "--gtest_filter=-*Integration*" 2>&1 | tee ../../tests.log
      - name: Pack portable build
        working-directory: tree/build
        run: |
          cmake . -DAUI_APP_PACKAGING=AUI_PORTABLE_TGZ
          cmake --build . --config RelWithDebInfo
          cpack . -CRelWithDebInfo -B artifacts
      - name: Upload the build
        uses: actions/upload-artifact@v4
        with:
          name: kuni-linux
          path: tree/build/artifacts/*.*
      - name: Short error summary (shown on the run page)
        if: failure()
        working-directory: tree
        run: |
          {
            echo '### Build errors (first 60 lines)'
            echo '```'
            grep -n -E 'error:|FAILED|Error [0-9]' build.log 2>/dev/null | head -60 || true
            echo '```'
            echo '### Failed tests'
            echo '```'
            grep -n -E 'FAILED|Failure' tests.log 2>/dev/null | head -40 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
